name: Build card PNG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-card-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip card png build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified 512px back card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, hashlib, re, struct

          EXPECTED_B64_LEN = 92736

          def clean(path):
              return re.sub(r'[^A-Za-z0-9+/=]', '', Path(path).read_text(encoding='utf-8'))

          def validate_png(data):
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise ValueError('invalid PNG signature')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (512, 683):
                  raise ValueError(f'wrong dimensions {width}x{height}')
              pos = 8
              seen_iend = False
              while pos + 12 <= len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  end = pos + 12 + length
                  if end > len(data):
                      raise ValueError('truncated PNG chunk')
                  chunk = data[pos+8:pos+8+length]
                  expected = struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
                  actual = binascii.crc32(ctype + chunk) & 0xffffffff
                  if actual != expected:
                      raise ValueError(f'CRC mismatch in {ctype!r}')
                  pos = end
                  if ctype == b'IEND':
                      seen_iend = True
                      break
              if not seen_iend or pos != len(data):
                  raise ValueError('invalid PNG ending')
              return width, height

          part1 = clean('assets/hq_back_01.b64')
          part2 = clean('assets/hq_back_02.b64')
          src3 = clean('assets/hq_back_03.b64')
          suffix3 = clean('.repair/back03_suffix.txt')
          part4 = clean('assets/hq_back_04.b64')
          part5 = clean('.repair/back05_full.txt')
          part6 = clean('.repair/back06_full.txt')

          keep3 = EXPECTED_B64_LEN - sum(map(len, [part1, part2, suffix3, part4, part5, part6]))
          if not 0 <= keep3 <= len(src3):
              raise SystemExit(f'Invalid back03 splice point: {keep3}')

          text = part1 + part2 + src3[:keep3] + suffix3 + part4 + part5 + part6
          if len(text) != EXPECTED_B64_LEN:
              raise SystemExit(f'Base64 length mismatch: {len(text)} != {EXPECTED_B64_LEN}')

          data = base64.b64decode(text, validate=True)
          width, height = validate_png(data)
          digest = hashlib.sha256(data).hexdigest()

          Path('assets/card_back.png').write_bytes(data)
          print(f'card_back.png: {width}x{height}, {len(data)} bytes')
          print(f'SHA256: {digest}')
          print(f'Repair splice: back03={keep3}')
          PY

      - name: Commit verified 512px back card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/card_back.png
          if git diff --cached --quiet; then
            echo 'Back PNG is already up to date.'
            exit 0
          fi
          git commit -m 'Upgrade back card to verified 512px PNG [skip card png build]'
          git push
