name: Build card PNG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-card-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip card png build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact 512px back card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, hashlib, re, struct

          EXPECTED_SIZE = 69550
          EXPECTED_SHA = '4cd5f0e2fb071d2650ab203bb872bddca79296ff83fadb0006212b70c1f02a83'
          EXPECTED_B64_LEN = 92736

          def clean(path):
              return re.sub(r'[^A-Za-z0-9+/=]', '', Path(path).read_text(encoding='utf-8'))

          def validate_png(data):
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('invalid PNG signature')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (512, 683):
                  raise SystemExit(f'wrong dimensions {width}x{height}')
              pos = 8
              seen_iend = False
              while pos + 12 <= len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  end = pos + 12 + length
                  if end > len(data):
                      raise SystemExit('truncated PNG chunk')
                  chunk = data[pos+8:pos+8+length]
                  expected = struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
                  actual = binascii.crc32(ctype + chunk) & 0xffffffff
                  if actual != expected:
                      raise SystemExit(f'CRC mismatch in {ctype!r}')
                  pos = end
                  if ctype == b'IEND':
                      seen_iend = True
                      break
              if not seen_iend or pos != len(data):
                  raise SystemExit('invalid PNG ending')
              return width, height

          parts = [
              clean('assets/hq_back_01.b64'),
              clean('assets/hq_back_02.b64'),
              clean('.repair/back03_full.txt'),
              clean('assets/hq_back_04.b64'),
              clean('.repair/back05_full.txt'),
              clean('.repair/back06_full.txt'),
          ]
          text = ''.join(parts)
          if len(text) != EXPECTED_B64_LEN:
              raise SystemExit(f'Base64 length mismatch: {len(text)} != {EXPECTED_B64_LEN}')

          data = base64.b64decode(text, validate=True)
          if len(data) != EXPECTED_SIZE:
              raise SystemExit(f'PNG size mismatch: {len(data)} != {EXPECTED_SIZE}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != EXPECTED_SHA:
              raise SystemExit(f'SHA256 mismatch: {digest}')
          width, height = validate_png(data)

          Path('assets/card_back.png').write_bytes(data)
          print(f'card_back.png: {width}x{height}, {len(data)} bytes')
          print(f'SHA256: {digest} OK')
          PY

      - name: Commit verified 512px back card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/card_back.png
          if git diff --cached --quiet; then
            echo 'Back PNG is already up to date.'
            exit 0
          fi
          git commit -m 'Upgrade back card to verified 512px PNG [skip card png build]'
          git push
