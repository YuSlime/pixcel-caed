name: Build card PNG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-card-pngs.yml'
      - 'assets/front_*.b64'
      - 'assets/back_*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip card png build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild valid PNG files from known-good card art
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, re, struct, binascii

          def clean(path):
              return re.sub(r'[^A-Za-z0-9+/=]', '', Path(path).read_text(encoding='utf-8'))

          def decode_webp(parts, out):
              text=''.join(clean(p) for p in parts)
              raw=base64.b64decode(text, validate=True)
              if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                  raise SystemExit(f'{out}: source is not a valid WebP container')
              with Image.open(io.BytesIO(raw)) as im:
                  im.load()
                  print(f'{out}: source {im.format} {im.size} {im.mode}')
                  im=im.convert('RGBA')
                  im.save(out, 'PNG', optimize=True)
              validate_png(Path(out).read_bytes(), out)

          def validate_png(data, name):
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'{name}: invalid PNG signature')
              pos=8; seen=False
              while pos+12 <= len(data):
                  length=struct.unpack('>I',data[pos:pos+4])[0]
                  ctype=data[pos+4:pos+8]
                  end=pos+12+length
                  if end>len(data): raise SystemExit(f'{name}: truncated chunk')
                  chunk=data[pos+8:pos+8+length]
                  exp=struct.unpack('>I',data[pos+8+length:pos+12+length])[0]
                  got=binascii.crc32(ctype+chunk)&0xffffffff
                  if got!=exp: raise SystemExit(f'{name}: CRC mismatch')
                  pos=end
                  if ctype==b'IEND': seen=True; break
              if not seen or pos!=len(data): raise SystemExit(f'{name}: invalid PNG ending')
              print(f'{name}: {len(data)} bytes PNG verified')

          decode_webp([
              'assets/front_1.b64','assets/front_2.b64','assets/front_3.b64','assets/front_4.b64','assets/front_5.b64'
          ], 'assets/card_front.png')
          decode_webp([
              'assets/back_1.b64','assets/back_2.b64','assets/back_3.b64','assets/back_4.b64'
          ], 'assets/card_back.png')
          PY

      - name: Commit verified PNG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/card_front.png assets/card_back.png
          if git diff --cached --quiet; then
            echo 'PNG files are already up to date.'
            exit 0
          fi
          git commit -m 'Generate valid PNG card assets [skip card png build]'
          git push
