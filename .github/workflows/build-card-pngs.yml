name: Build card PNG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-card-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose exact 512px back chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          expected = [
              ('ad3a671a4eee19f4e9a36a9d3232dea09aa9134975126774a6303e83697cddf4', 18000),
              ('4719e841b360c89ec21b251b7bcfd4ce2daa5e8c49c73ad144d149170e4d541f', 18000),
              ('ba4007865b69c0d028ceae91760bf5c55f0d88edc779a5b4d7ca0b0745c1f43c', 18000),
              ('c3bb7b996d8df5682c5ec8f9100d06daa42936508eabc0274a4ad446d5137693', 18000),
              ('6bef1b09e5732e85da312e5d01ebbaadf35b586c1ea83e31a837f9dd0513e03e', 18000),
              ('cf00a8c205f158398c9ab12151dd865e9e6e6dbbcb269b6fa1303d2024d6d274', 2736),
          ]
          paths = [
              '.repair/back01_full.txt',
              '.repair/back02_full.txt',
              '.repair/back03_full.txt',
              'assets/hq_back_04.b64',
              '.repair/back05_full.txt',
              '.repair/back06_full.txt',
          ]

          bad=[]
          for i,(path,(want_hash,want_len)) in enumerate(zip(paths,expected),1):
              s=re.sub(r'[^A-Za-z0-9+/=]','',Path(path).read_text(encoding='utf-8'))
              got=hashlib.sha256(s.encode()).hexdigest()
              ok=(len(s)==want_len and got==want_hash)
              print(f'chunk{i}: path={path} len={len(s)}/{want_len} sha256={got} expected={want_hash} match={ok}')
              if not ok: bad.append(i)
          if bad:
              raise SystemExit(f'mismatched chunks: {bad}')
          print('all chunks match exact 512px source')
          PY
