name: Import starter card PNGs

on:
  push:
    branches: ["feature/card-library-deck"]
    paths:
      - '.card-import/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check import payload
        id: ready
        shell: bash
        run: |
          if [ -f .card-import/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and validate PNG files
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import struct

          mapping = {
              'pebblout': (pathlib.Path('assets/cards/pebblout/front.png'), '777ba1c3e16f114f2833c2cdde45c1d054676e896dbf959d690c772596bd69e9'),
              'flutterpuff': (pathlib.Path('assets/cards/flutterpuff/front.png'), '7ca97fd212a5a2e51e8388c691702424048f3c082190daa64333778a3a1b5f5a'),
              'pip-bat': (pathlib.Path('assets/cards/pip-bat/front.png'), '67a24899d778ae2221ba8371a0d3ba16c60d0a72d27f00cdec1eee3d40ccf656'),
              'wispy': (pathlib.Path('assets/cards/wispy/front.png'), '7aef636d58475edd6e39e9f13f14e4e855c4fc69469c10e6b78f32ba82ebc6d0'),
              'slime': (pathlib.Path('assets/cards/slime/front.png'), '834964fcd0d7734f5552be1ebcc7f9919850c87cf550b3ddc2e9a559d5da2832'),
          }

          for card_id, (output, expected_sha) in mapping.items():
              chunk_dir = pathlib.Path('.card-import') / card_id
              chunks = sorted(chunk_dir.glob('*.txt'))
              if not chunks:
                  raise SystemExit(f'No chunks found for {card_id}')
              encoded = ''.join(p.read_text().strip() for p in chunks)
              data = base64.b64decode(encoded, validate=True)
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{card_id}: not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (512, 682):
                  raise SystemExit(f'{card_id}: unexpected dimensions {width}x{height}')
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'{card_id}: SHA-256 mismatch {actual_sha}')
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
              print(card_id, len(data), f'{width}x{height}', actual_sha)
          PY

      - name: Commit reconstructed PNG files
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .card-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/cards .card-import
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Build starter card PNG assets"
          git push
