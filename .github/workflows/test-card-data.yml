name: Test card data

on:
  push:
    branches: ["main", "feature/supabase-card-source"]
    paths:
      - 'index.html'
      - 'card-manager.html'
      - 'data/cards.js'
      - 'data/card-source.js'
      - 'assets/cards/**'
      - 'tests/card-data.test.mjs'
      - 'tests/card-manager.test.mjs'
      - 'tests/card-source.test.mjs'
      - '.github/workflows/test-card-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate card source adapter
        run: node tests/card-source.test.mjs
      - name: Validate card registry, artwork and interactions
        run: node tests/card-data.test.mjs
      - name: Validate CARD MANAGER
        run: node tests/card-manager.test.mjs
