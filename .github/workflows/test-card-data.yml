name: Test card data

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'data/cards.js'
      - 'assets/card_front.png'
      - 'assets/card_back.png'
      - 'tests/card-data.test.mjs'
      - '.github/workflows/test-card-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test card registry
        run: node tests/card-data.test.mjs
      - name: Verify high-resolution front card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('assets/card_front.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('card_front.png is not a PNG')
          w, h = struct.unpack('>II', data[16:24])
          print(f'card_front.png: {w}x{h}')
          if (w, h) != (512, 683):
              raise SystemExit(f'expected 512x683, got {w}x{h}')
          PY
