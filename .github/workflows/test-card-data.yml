name: Test card data

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
    paths:
      - 'index.html'
      - 'card-manager.html'
      - 'data/cards.js'
      - 'data/card-source.js'
      - 'data/card-maker*.js'
      - 'assets/cards/**'
      - 'assets/card-maker/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - '.github/workflows/test-card-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate card data, original assets and rendering core
        run: npm test
      - name: Test image selection, canvas, export, upload and game interactions
        run: npm run test:browser
