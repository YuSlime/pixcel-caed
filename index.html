<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL CARD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#07111e;color:#fff;overflow:hidden}button{font:inherit}.screen{position:fixed;inset:0}#menu{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#173d68 0,#0a1b2e 45%,#050b12 100%)}.panel{width:min(680px,92vw);padding:50px 25px;text-align:center;border:2px solid #365d86;border-radius:24px;background:#071321eb;box-shadow:0 30px 80px #0008}h1{font-size:clamp(32px,7vw,64px);margin:0 0 12px;letter-spacing:5px}.desc{color:#a9c3dd;margin-bottom:12px}.status{color:#6f96bc;font-size:12px;margin-bottom:28px}#battleBtn{border:0;border-radius:12px;padding:18px 60px;color:#fff;font-weight:900;font-size:20px;background:linear-gradient(#40a7ff,#1163ba);box-shadow:0 8px 0 #093c72;cursor:pointer;transition:.15s}#battleBtn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px)}#battleBtn:disabled{opacity:.45;cursor:wait}#battle{display:none;grid-template-rows:56px minmax(0,1fr) 240px;height:100%}header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff18;background:#08131f}#backBtn{padding:8px 12px;border:1px solid #ffffff25;background:#ffffff0b;color:#fff;border-radius:8px;cursor:pointer}.board{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:30px;background:radial-gradient(circle at center,#163e67 0,#0d2339 36%,#08131f 100%);border-bottom:1px solid #ffffff15;overflow:auto}.board:before{content:"YOUR FIELD";position:absolute;top:14px;left:18px;color:#7fa6c9;font-size:12px;letter-spacing:2px}.empty{color:#8daac5;border:1px dashed #507293;padding:18px;border-radius:10px;text-align:center}.hand{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:28px 12px 30px;background:#07101a;overflow:visible;min-height:240px}.hand:before{content:"YOUR HAND";position:absolute;left:16px;top:10px;color:#6f96bc;font-size:11px;letter-spacing:2px}.slot{width:120px;aspect-ratio:3/4;perspective:1000px;cursor:pointer;transition:.18s;position:relative;flex:0 0 auto}.slot:hover{transform:translateY(-20px) scale(1.05);z-index:20}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s ease;filter:drop-shadow(0 12px 10px #0008)}.slot:hover .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.face.front{transform:rotateY(180deg)}.face img,.fieldCard img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}.fieldCard{width:165px;aspect-ratio:3/4;animation:drop .25s ease-out;filter:drop-shadow(0 14px 12px #0008)}@keyframes drop{from{opacity:0;transform:translateY(60px) scale(.8)}to{opacity:1;transform:none}}#msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:8px;background:#06101be8;border:1px solid #4185bd;color:#d8efff;opacity:0;transition:.2s;pointer-events:none;z-index:99}#msg.show{opacity:1}@media(max-width:760px){#battle{grid-template-rows:52px minmax(0,1fr) 190px}.slot{width:17vw;max-width:82px;min-width:55px}.hand{gap:3px;padding:26px 5px 22px;min-height:190px}.fieldCard{width:120px}}
</style>
</head>
<body>
<section id="menu" class="screen"><div class="panel"><h1>PIXEL CARD</h1><div class="desc">カード反転・手札・場への配置テスト</div><div id="status" class="status">カード画像を読み込み中...</div><button id="battleBtn" disabled>BATTLE</button></div></section>
<section id="battle" class="screen"><header><b>BATTLE FIELD</b><button id="backBtn">メニューへ戻る</button></header><main id="board" class="board"></main><footer id="hand" class="hand"></footer><div id="msg"></div></section>
<script>
let FRONT='',BACK='';
const N=5,menu=document.getElementById('menu'),battle=document.getElementById('battle'),board=document.getElementById('board'),hand=document.getElementById('hand'),msg=document.getElementById('msg'),battleBtn=document.getElementById('battleBtn'),statusEl=document.getElementById('status');
const BACK_PARTS=['assets/back_1.b64','assets/back_2.b64','assets/back_3.b64','assets/back_4.b64'];
const FRONT_PARTS=['assets/hq_front_01.b64','assets/hq_front_02.b64','assets/hq_front_03.b64','assets/hq_front_04.b64','assets/hq_front_05.b64','assets/hq_front_06.b64','assets/hq_front_07.b64'];
async function loadChunks(paths){const rows=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: ${r.status}`);return (await r.text()).trim()}));return rows.join('')}
function verifyImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve();img.onerror=()=>reject(new Error('画像デコード失敗'));img.src=src})}
async function loadArt(){try{const [back64,front64]=await Promise.all([loadChunks(BACK_PARTS),loadChunks(FRONT_PARTS)]);BACK='data:image/webp;base64,'+back64;FRONT='data:image/png;base64,'+front64;await Promise.all([verifyImage(BACK),verifyImage(FRONT)]);battleBtn.disabled=false;statusEl.textContent='READY - 高画質カード表面を読み込みました'}catch(e){statusEl.textContent='画像の読み込みに失敗しました。再読み込みしてください';console.error(e)}}
battleBtn.onclick=()=>{menu.style.display='none';battle.style.display='grid';reset()};
document.getElementById('backBtn').onclick=()=>{battle.style.display='none';menu.style.display='flex'};
function reset(){hand.innerHTML='';board.innerHTML='<div id="empty" class="empty">カードにカーソルを合わせると表になります。<br>クリックすると場に出せます。</div>';for(let i=0;i<N;i++)hand.appendChild(makeCard())}
function makeCard(){const s=document.createElement('div');s.className='slot';s.innerHTML=`<div class="inner"><div class="face back"><img src="${BACK}" alt="カード裏面"></div><div class="face front"><img src="${FRONT}" alt="Novice Fighter"></div></div>`;s.onclick=()=>playCard(s);return s}
function playCard(s){document.getElementById('empty')?.remove();const c=document.createElement('div');c.className='fieldCard';c.innerHTML=`<img src="${FRONT}" alt="Novice Fighter">`;board.appendChild(c);s.remove();toast('Novice Fighter を場に出しました')}
function toast(t){msg.textContent=t;msg.classList.add('show');clearTimeout(window.mt);window.mt=setTimeout(()=>msg.classList.remove('show'),900)}
loadArt();
</script>
</body>
</html>
