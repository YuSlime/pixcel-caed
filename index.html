const CARD_COUNT=5;const menu=document.getElementById('menu'),battle=document.getElementById('battle'),board=document.getElementById('board'),hand=document.getElementById('hand'),msg=document.getElementById('msg');document.getElementById('battleBtn').addEventListener('click',startBattle);document.getElementById('backBtn').addEventListener('click',goMenu);
function startBattle(){menu.style.display='none';battle.style.display='grid';resetGame()}function goMenu(){battle.style.display='none';menu.style.display='flex'}function resetGame(){hand.innerHTML='';board.innerHTML='<div id="empty" class="empty">カードにカーソルを合わせると表になります。<br>クリックすると場に出せます。</div>';for(let i=0;i<CARD_COUNT;i++)hand.appendChild(makeCard(i))}function makeCard(i){const slot=document.createElement('div');slot.className='slot';slot.innerHTML=`<div class="inner"><div class="face back"><img src="${BACK}" alt="カード裏面"></div><div class="face front"><img src="${FRONT}" alt="Novice Fighter"></div></div>`;slot.addEventListener('click',()=>playCard(slot));return slot}function playCard(slot){const empty=document.getElementById('empty');if(empty)empty.remove();const card=document.createElement('div');card.className='fieldCard';card.innerHTML=`<img src="${FRONT}" alt="Novice Fighter">`;board.appendChild(card);slot.remove();showMessage('Novice Fighter を場に出しました')}function showMessage(text){msg.textContent=text;msg.classList.add('show');clearTimeout(window.msgTimer);window.msgTimer=setTimeout(()=>msg.classList.remove('show'),900)}
</script>
